[project]
name = "scheming-inspect"
version = "0.1.0"
description = "Transparent Inspect reconstruction of six in-context scheming evaluations"
requires-python = ">=3.12"
dependencies = ["inspect-ai==0.3.281", "openai>=2,<4", "python-dotenv>=1.1,<2", "matplotlib>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scheming_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: integration tests that need Docker (opt in with RUN_DOCKER_TESTS=1)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
